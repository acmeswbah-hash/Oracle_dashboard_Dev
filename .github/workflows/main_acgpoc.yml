# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - acgpoc

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install API dependencies
        run: npm install --omit=dev

      - name: Build React UI into ar-ui/dist
        run: npm run build

      - name: Write login users file from GitHub secret
        env:
          USER_DETAILS_XLSX_B64: ${{ secrets.USER_DETAILS_XLSX_B64 }}
        shell: pwsh
        run: |
          if (-not $env:USER_DETAILS_XLSX_B64) {
            throw "Missing GitHub secret USER_DETAILS_XLSX_B64"
          }
          New-Item -ItemType Directory -Force -Path data | Out-Null
          $out = Join-Path "data" "User_Details.xlsx"
          [IO.File]::WriteAllBytes($out, [Convert]::FromBase64String($env:USER_DETAILS_XLSX_B64.Trim()))
          Write-Host "Wrote $out ($((Get-Item $out).Length) bytes)"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          include-hidden-files: false
          path: |
            .
            !ar-ui/node_modules/**
            !ar-ui/src/**
            !.git/**
            !.github/**
            !**/*.md

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: https://acgpoc-e3ejg5bacwh5fef5.uaenorth-01.azurewebsites.net

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'acgpoc'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D4BE3B75A6AB4130B6078118EB78689A }}
